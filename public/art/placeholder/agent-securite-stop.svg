    <path d="M132 66 L134 74 L130 75" fill="none" stroke-width="2"/>
    <path d="M120 79 Q130 75 141 79 Q136 82 130 81 Q124 82 120 79 Z" fill="#4f3a2a" stroke-width="1.6"/>
    <ellipse cx="131" cy="87" rx="5.5" ry="4" fill="#7c2f2a" stroke-width="1.8"/>
    <path d="M100 208 L96 296 M136 208 L142 296" stroke="#182030" stroke-width="1.8" opacity="0.6"/>
