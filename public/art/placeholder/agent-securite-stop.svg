      <path d="M200 116 L216 112 L222 122 L222 146 L210 151 L198 145 Z" fill="#e6bc95"/>
      <!-- Cou -->
      <path d="M110 86 L135 86 L137 104 L109 104 Z" fill="#d9ad87"/>
      <!-- Tête adulte -->
      <path d="M100 46 L144 46 L148 68 L144 86 L126 94 L106 88 L98 68 Z" fill="#e6bc95"/>
      <!-- Oreille -->
      <path d="M96 63 L103 62 L103 77 L96 75 Z" fill="#d7aa83"/>
      <!-- Casquette d'agent -->
      <path d="M95 48 L100 24 L126 19 L148 26 L151 48 Z" fill="#222b3e"/>
      <path d="M95 44 L151 44 L151 51 L95 51 Z" fill="#181f2e"/>
      <path d="M140 45 L172 49 L168 54 L138 52 Z" fill="#141a26"/>
