<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800" viewBox="0 0 1100 800">
  <!-- [TEMP] Dehors, vu par le mur vitré du hall (séance 57, 1100 × 800) : le parking, la nuit, sous la pluie. Silhouettes floues (flou dessiné dans l'image, calculé une fois au chargement), arbres, voitures garées, lampadaire et son halo, reflets sur le bitume mouillé. Calque derrière le fond, en parallaxe (il glisse moins vite que le mur). Généré, provisoire. -->
  <defs>
    <linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#121a26"/><stop offset="0.55" stop-color="#22303f"/><stop offset="1" stop-color="#2c3a48"/></linearGradient>
    <linearGradient id="sol" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d242c"/><stop offset="1" stop-color="#11161b"/></linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffe2a0" stop-opacity="0.75"/><stop offset="0.35" stop-color="#f5c66a" stop-opacity="0.28"/><stop offset="1" stop-color="#f5c66a" stop-opacity="0"/></radialGradient>
    <radialGradient id="flaque" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffd98a" stop-opacity="0.45"/><stop offset="1" stop-color="#ffd98a" stop-opacity="0"/></radialGradient>
    <filter id="loin" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="mi" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="3.5"/></filter>
  </defs>
  <rect width="1100" height="800" fill="url(#ciel)"/>
  <!-- Arbres et haie au loin, flous. -->
  <g filter="url(#loin)" fill="#0d1419">
    <path d="M0 250 q40 -70 90 -40 q30 -60 90 -20 q50 -50 100 0 q40 -40 90 10 q60 -60 120 -10 q40 -40 100 10 q50 -50 110 -5 q40 -30 90 5 q60 -50 120 0 q50 -40 110 10 V300 H0 z"/>
    <rect x="0" y="282" width="1100" height="30"/>
  </g>
  <!-- Bitume mouillé. -->
  <rect y="300" width="1100" height="500" fill="url(#sol)"/>
  <g stroke="#3d4955" stroke-width="5" opacity="0.5" filter="url(#mi)"><path d="M-40 520 l-80 280 M220 520 l-50 280 M480 520 l-12 280 M740 520 l30 280 M1000 520 l70 280"/><path d="M0 500 h1100" stroke-width="3"/></g>
  <g stroke="#3d4955" stroke-width="4" opacity="0.6" filter="url(#mi)">
    <path d="M60 330 l-30 120 M260 330 l-20 120 M460 330 l-8 120 M660 330 l6 120 M860 330 l20 120 M1060 330 l32 120"/>
  </g>
  <!-- Voitures garées, floues (silhouettes, feux arrière). -->
  <g filter="url(#mi)">
    <path d="M120 330 q10 -36 60 -40 h70 q40 4 56 40 v22 h-186 z" fill="#2a333d"/>
    <path d="M520 334 q12 -34 62 -38 h60 q44 4 58 38 v20 h-180 z" fill="#323b44"/>
    <path d="M860 328 q8 -32 54 -36 h66 q40 4 54 36 v24 h-174 z" fill="#28313a"/>
    <rect x="128" y="334" width="14" height="6" fill="#b4473c"/><rect x="292" y="334" width="14" height="6" fill="#b4473c"/>
    <rect x="868" y="332" width="12" height="6" fill="#b4473c"/>
  </g>
  <!-- Lampadaire et son halo ; son reflet dans les flaques. -->
  <rect x="436" y="120" width="8" height="200" fill="#0e1318"/>
  <path d="M440 122 q30 -18 70 -10" fill="none" stroke="#0e1318" stroke-width="7"/>
  <ellipse cx="506" cy="118" rx="16" ry="7" fill="#ffe9b8"/>
  <circle cx="506" cy="150" r="150" fill="url(#halo)"/>
  <path d="M506 124 L420 312 H596 z" fill="#ffe2a0" opacity="0.08"/>
  <ellipse cx="510" cy="380" rx="130" ry="26" fill="url(#flaque)"/>
  <ellipse cx="510" cy="420" rx="70" ry="10" fill="url(#flaque)"/>
  <path d="M480 330 L420 800 H600 L540 330 z" fill="#ffe2a0" opacity="0.07"/>
  <ellipse cx="500" cy="600" rx="160" ry="30" fill="url(#flaque)"/>
  <ellipse cx="760" cy="700" rx="90" ry="16" fill="url(#flaque)" opacity="0.6"/>
</svg>
