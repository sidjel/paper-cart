<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="220" height="320" viewBox="0 0 220 320">
  <!-- [TEMP] Le héros pousse le chariot (séance 75) : ses deux bras tendus vers la poignée, par-dessus le bras qui pend. L'autre bras ne se voit qu'à partir du bord du torse (il passe derrière). Une seule image (limite des comptages). Mêmes coordonnées que les images du héros (220 × 320). Généré, provisoire. -->
  <defs>
    <filter id="crayon" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="5"/><feDisplacementMap in="SourceGraphic" scale="2.5"/></filter>
    <g id="loin"><path d="M160 178 h30 q10 0 10 10 q0 10 -10 10 h-30 z" fill="#5f84a8"/><circle cx="198" cy="190" r="9.5" fill="#f0d2b0"/></g>
    <g id="pres"><path d="M142 166 q26 4 34 30 q2 6 8 6 h16 q10 0 10 10 q0 10 -10 10 h-24 q-12 0 -16 -10 q-8 -20 -22 -28 z" fill="#6a8fb3"/><circle cx="204" cy="212" r="10" fill="#f0d2b0"/></g>
  </defs>
  <g filter="url(#crayon)">
    <use href="#loin" xlink:href="#loin" stroke="#fbf8ee" stroke-width="10" stroke-linejoin="round"/>
    <use href="#loin" xlink:href="#loin" stroke="#4a4236" stroke-width="2.6" stroke-linejoin="round"/>
    <use href="#pres" xlink:href="#pres" stroke="#fbf8ee" stroke-width="10" stroke-linejoin="round"/>
    <use href="#pres" xlink:href="#pres" stroke="#4a4236" stroke-width="2.6" stroke-linejoin="round"/>
  </g>
</svg>
