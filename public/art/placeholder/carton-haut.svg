<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="360" height="100" viewBox="0 0 360 100">
  <!-- [TEMP] Haut de l'étagère du rayon 8 (A8, séance 77) : le dernier carton encore en place, au bord, un peu de travers ; à côté, les traces claires dans la poussière des trois cartons tombés au sol. Bas en (180, 96), posé sur le haut de l'étagère. Généré, provisoire. -->
  <defs>
    <filter id="crayon" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="11"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter>
    <g id="carton"><path d="M228 12 h108 v84 h-108 z" fill="#c19a66" transform="rotate(5 282 96)"/></g>
  </defs>
  <g filter="url(#crayon)">
    <path d="M12 88 h66 v8 h-66 z M92 88 h60 v8 h-60 z M162 88 h56 v8 h-56 z" fill="#f4efdf" stroke="#cfc6ad" stroke-width="1.6" stroke-dasharray="5 4"/>
    <use href="#carton" xlink:href="#carton" stroke="#fbf8ee" stroke-width="10" stroke-linejoin="round"/>
    <use href="#carton" xlink:href="#carton" stroke="#4a4236" stroke-width="2.6" stroke-linejoin="round"/>
    <path d="M282 14 v80" stroke="#d8c39a" stroke-width="10" opacity="0.8" transform="rotate(5 282 96)"/>
    <text x="240" y="62" font-family="sans-serif" font-size="13" font-weight="700" fill="#5a4630" transform="rotate(5 282 96)">RAYON 8</text>
  </g>
</svg>
