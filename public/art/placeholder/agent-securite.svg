<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="240" height="340" viewBox="0 0 240 340">
  <!-- [TEMP] Agent de sécurité du hall (A6) — placeholder proportionné ~1m85 (aligné sur le héros origami 240×340, pieds en 120, 328). Tourné vers la droite, au repos. -->
  <defs>
    <g id="guard-idle">
      <!-- Jambe arrière (gauche) et botte -->
      <path d="M95 194 L117 194 L114 306 L91 306 Z" fill="#1e273a"/>
      <path d="M87 306 L116 306 L124 322 L122 328 L84 328 L83 318 Z" fill="#232120"/>
      <!-- Jambe avant (droite) et botte -->
      <path d="M119 194 L145 194 L149 306 L124 306 Z" fill="#263148"/>
      <path d="M122 306 L151 306 L163 321 L160 328 L120 328 L119 318 Z" fill="#2b2826"/>
      <!-- Bras arrière (droit du garde, côté droit à l'écran) -->
      <path d="M148 112 L166 118 L171 186 L154 188 L149 144 Z" fill="#25314a"/>
      <path d="M155 186 L170 185 L172 200 L164 205 L154 201 Z" fill="#dfb38d"/>
      <!-- Torse large en uniforme bleu marine -->
      <path d="M83 108 L112 100 L134 100 L159 109 L154 196 L92 196 Z" fill="#2e3d5c"/>
      <!-- Pli/facette d'ombre côté gauche -->
      <path d="M83 108 L108 104 L106 196 L92 196 Z" fill="#25324d"/>
      <!-- Ceinturon tactique -->
      <rect x="91" y="182" width="64" height="14" rx="2" fill="#1a202d"/>
      <rect x="119" y="184" width="14" height="10" rx="1.5" fill="#c7ccd4"/>
      <rect x="95" y="181" width="11" height="16" rx="2" fill="#2b313d"/>
      <!-- Bras avant (gauche à l'écran), solide le long du corps -->
      <path d="M82 112 L96 116 L93 188 L76 188 L74 146 Z" fill="#293754"/>
      <path d="M77 187 L92 187 L93 203 L83 206 L75 201 Z" fill="#e6bc95"/>
      <!-- Cou -->
      <path d="M108 86 L133 86 L135 104 L107 104 Z" fill="#d9ad87"/>
      <!-- Tête adulte (proportion ~5.5 têtes) -->
      <path d="M98 46 L142 46 L146 68 L142 86 L124 94 L104 88 L96 68 Z" fill="#e6bc95"/>
      <!-- Oreille -->
      <path d="M94 63 L101 62 L101 77 L94 75 Z" fill="#d7aa83"/>
      <!-- Casquette d'agent -->
      <path d="M93 48 L98 24 L124 19 L146 26 L149 48 Z" fill="#222b3e"/>
      <path d="M93 44 L149 44 L149 51 L93 51 Z" fill="#181f2e"/>
      <!-- Visière vers la droite -->
      <path d="M138 45 L170 49 L166 54 L136 52 Z" fill="#141a26"/>
    </g>
  </defs>
  <!-- Ombre douce au sol -->
  <ellipse cx="122" cy="328" rx="48" ry="8" fill="#3a3228" opacity="0.24"/>
  <!-- Bordure papier découpé blanc chaud -->
  <use href="#guard-idle" xlink:href="#guard-idle" stroke="#faf8f2" stroke-width="11" stroke-linejoin="round"/>
  <!-- Contours encrés -->
  <use href="#guard-idle" xlink:href="#guard-idle" stroke="#2d241d" stroke-width="2.6" stroke-linejoin="round"/>
  <!-- Détails visage et uniforme -->
  <g stroke="#2d241d" stroke-linecap="round" stroke-linejoin="round">
    <!-- Col et cravate -->
    <path d="M107 101 L122 114 L136 101" fill="#38496d" stroke-width="2.2"/>
    <path d="M119 110 L125 110 L128 152 L122 160 L116 152 Z" fill="#182030" stroke-width="2"/>
    <!-- Épaulettes -->
    <path d="M84 109 L101 104" stroke="#dfb748" stroke-width="4"/>
    <path d="M142 104 L158 109" stroke="#dfb748" stroke-width="4"/>
    <!-- Insigne casquette -->
    <path d="M126 30 L132 36 L126 41 L120 36 Z" fill="#e2bb4d" stroke-width="1.8"/>
    <!-- Badge poitrine -->
    <path d="M133 122 L144 120 L146 130 L139 136 L132 130 Z" fill="#e2bb4d" stroke-width="1.8"/>
    <!-- Écusson SÉCU -->
    <rect x="93" y="122" width="24" height="12" rx="2" fill="#faf8f2" stroke-width="1.8"/>
    <text x="105" y="131" font-family="Trebuchet MS, Arial, sans-serif" font-size="7.5" font-weight="700" fill="#222b3e" stroke="none" text-anchor="middle">SÉCU</text>
    <!-- Sourcils sévères et yeux -->
    <path d="M114 58 L125 61 M132 61 L142 58" stroke="#2d241d" stroke-width="3.2"/>
    <ellipse cx="120" cy="66" rx="2.8" ry="3.4" fill="#2d241d" stroke="none"/>
    <ellipse cx="137" cy="66" rx="2.6" ry="3.4" fill="#2d241d" stroke="none"/>
    <!-- Nez -->
    <path d="M130 66 L132 74 L128 75" fill="none" stroke-width="2"/>
    <!-- Moustache et bouche ferme -->
    <path d="M118 79 Q128 75 139 79 Q134 83 128 82 Q122 83 118 79 Z" fill="#4f3a2a" stroke-width="1.6"/>
    <path d="M123 86 L134 86" stroke-width="2"/>
    <!-- Plis pantalon -->
    <path d="M104 208 L102 296 M134 208 L137 296" stroke="#182030" stroke-width="1.8" opacity="0.6"/>
  </g>
</svg>
