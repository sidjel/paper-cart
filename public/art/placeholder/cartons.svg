    <text x="70" y="182" font-family="sans-serif" font-size="14" font-weight="700" fill="#5a4630" transform="rotate(-14 112 173)">CE CÔTÉ ↑</text>
    <text x="146" y="256" font-family="sans-serif" font-size="13" font-weight="700" fill="#5a4630">RAYON 8</text>
