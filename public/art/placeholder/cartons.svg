<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="260" height="300" viewBox="0 0 260 300">
  <!-- [TEMP] Tas de cartons du rayon 8 (A8, séance 77) : trois cartons tombés du haut de l'étagère (où il en reste un), en désordre : un couché, un ouvert, un de travers par-dessus. Pied du tas en (130, 292). Généré, provisoire. -->
  <defs>
    <filter id="crayon" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="9"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter>
    <g id="tas">
      <path d="M14 214 h126 v78 h-126 z" fill="#b08a5a"/>
      <path d="M132 204 h112 v88 h-112 z" fill="#c19a66"/>
      <path d="M132 204 l-14 -26 h112 l14 26 z" fill="#d2ad78"/>
      <path d="M244 204 l12 -30 l-8 -4 l-18 8 z" fill="#c9a26d"/>
      <path d="M52 132 h120 v82 h-120 z" fill="#b8915f" transform="rotate(-14 112 173)"/>
    </g>
  </defs>
  <g filter="url(#crayon)">
    <use href="#tas" xlink:href="#tas" stroke="#fbf8ee" stroke-width="10" stroke-linejoin="round"/>
    <use href="#tas" xlink:href="#tas" stroke="#4a4236" stroke-width="2.6" stroke-linejoin="round"/>
