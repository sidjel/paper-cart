name: Essai CI CanvasRenderer (sans publication)

on:
  push:
    branches: [test/krita-mcp]

jobs:
  essai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests de la logique (Vitest + Knip)
        run: npm test
      - name: Navigateur de test
        run: npx playwright install --with-deps chromium
      - name: Construction
        run: npm run build
      - name: Mesure cadence CanvasRenderer vs WebGL sur runner Ubuntu
        run: |
          node --input-type=commonjs -e "
          const http = require('node:http');
          const fs = require('node:fs');
          const path = require('node:path');
          const { chromium } = require('@playwright/test');
          const DIST = path.resolve('dist');
          const MIME = { '.html':'text/html','.js':'application/javascript','.css':'text/css','.json':'application/json','.webp':'image/webp','.png':'image/png','.svg':'image/svg+xml','.mp3':'audio/mpeg','.ogg':'audio/ogg' };
          const server = http.createServer((req, res) => {
            const u = decodeURIComponent((req.url || '/').split('?')[0]);
            const f = path.join(DIST, u === '/' ? 'index.html' : u.replace(/^\/+/, ''));
            if (!fs.existsSync(f) || fs.statSync(f).isDirectory()) { res.writeHead(404); res.end(); return; }
            res.writeHead(200, { 'Content-Type': MIME[path.extname(f)] || 'application/octet-stream', 'Connection': 'close' });
            fs.createReadStream(f).pipe(res);
          });
          (async () => {
            await new Promise((r) => server.listen(0, '127.0.0.1', r));
            const base = 'http://127.0.0.1:' + server.address().port;
            for (const cfg of [
              { label: 'CanvasRenderer PC (1600x900)', args: ['--disable-webgl', '--disable-webgl2'], ctx: { viewport: { width: 1600, height: 900 } } },
              { label: 'CanvasRenderer Tel (914x411 dpr=2.625)', args: ['--disable-webgl', '--disable-webgl2'], ctx: { viewport: { width: 914, height: 411 }, deviceScaleFactor: 2.625, isMobile: true, hasTouch: true } },
              { label: 'WebGL defaut PC (1600x900)', args: [], ctx: { viewport: { width: 1600, height: 900 } } },
            ]) {
              const b = await chromium.launch({ headless: true, args: cfg.args });
              const c = await b.newContext(cfg.ctx);
              const p = await c.newPage();
              await p.goto(base + '/?lieu=accueil');
              await p.waitForFunction(() => window.paperCart?.state() === 'title');
              await p.evaluate(() => window.paperCart.startGame());
              await p.waitForFunction(() => window.paperCart?.state() === 'play');
              const t0 = await p.evaluate(() => window.paperCart.time());
              const res = await p.evaluate(() => new Promise((resolve) => {
                const dts = []; let last = performance.now(); const s = last;
                const step = (now) => {
                  dts.push(now - last); last = now;
                  if (now - s >= 3000) {
                    dts.shift();
                    const wall = dts.reduce((a, b) => a + b, 0);
                    const sc = window.paperCart.scene();
                    resolve({
                      renderer: sc.renderer, isWebGL: sc.isWebGL, stageNodes: sc.stageNodes,
                      frames: dts.length, fps: +(dts.length * 1000 / wall).toFixed(1),
                      avgDtMs: +(wall / dts.length).toFixed(1), maxDtMs: +Math.max(...dts).toFixed(1),
                      droppedOver83: dts.filter((d) => d > 83.33).length,
                      gameTime: window.paperCart.time(),
                    });
                  } else requestAnimationFrame(step);
                };
                requestAnimationFrame(step);
              }));
              console.log(cfg.label, JSON.stringify({ ...res, gameDeltaS: +(res.gameTime - t0).toFixed(2) }));
              await b.close();
            }
            server.close();
            process.exit(0);
          })();
          "
      - name: Suite Playwright complète (pc + telephone + webgl)
        run: npm run test:e2e
        env:
          CI: true
