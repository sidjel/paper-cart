<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Paper Cart — POC PixiJS v8 (Accueil &amp; Rayon 1)</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #141923; font-family: "Trebuchet MS", "Segoe UI", sans-serif; color: #f6f9ff; touch-action: none; }
      #pixi-root { position: fixed; inset: 0; }
      #pixi-root canvas { display: block; width: 100%; height: 100%; }
      .poc-hud { position: fixed; top: 8px; left: 8px; right: 8px; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; pointer-events: none; z-index: 10; flex-wrap: wrap; }
      .poc-badge, .poc-controls, .poc-report { pointer-events: auto; background: rgb(16 24 38 / 0.88); border: 1.5px solid #8fd3ff; border-radius: 10px; padding: 6px 10px; font-size: 12.5px; }
      .poc-controls { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
      .poc-controls button, .poc-controls a { background: #1e5bb8; color: #fff; border: 0; border-radius: 7px; padding: 6px 10px; font: inherit; font-weight: 700; cursor: pointer; text-decoration: none; }
      .poc-controls button.alt, .poc-controls a.alt { background: #2c384e; }
      .poc-controls button.active { background: #d9a441; color: #1b1610; }
      .poc-controls button.accent { background: #1d7a5f; }
      .poc-report { position: fixed; left: 8px; bottom: 8px; max-width: min(700px, calc(100vw - 16px)); max-height: 46vh; overflow: auto; white-space: pre-wrap; font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; z-index: 12; }
      .poc-report[hidden] { display: none; }
      @media (max-width: 760px) {
        .poc-badge, .poc-controls { font-size: 11px; padding: 5px 8px; }
        .poc-controls button, .poc-controls a { padding: 5px 8px; }
      }
    </style>
  </head>
  <body>
    <div id="pixi-root"></div>
    <div class="poc-hud">
      <div class="poc-badge" id="poc-stats">POC PixiJS v8 — chargement…</div>
      <div class="poc-controls">
        <button id="poc-place-accueil" class="alt" type="button">Accueil</button>
        <button id="poc-place-rayon" class="alt" type="button">Rayon 1</button>
        <button id="poc-trans-bench" class="accent" type="button">Test 5 allers-retours</button>
        <button id="poc-bench" type="button">Banc (3 tours)</button>
        <button id="poc-bench-fast" class="alt" type="button">Rapide (1 tour)</button>
        <button id="poc-copy" class="alt" type="button" hidden>Copier</button>
      </div>
    </div>
    <pre class="poc-report" id="poc-report" hidden></pre>
    <script type="module" src="/src/pixi/poc.js"></script>
  </body>
</html>
