<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Paper Cart — POC PixiJS v8 (Rayon 1)</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #141923; font-family: "Trebuchet MS", "Segoe UI", sans-serif; color: #f6f9ff; touch-action: none; }
      #pixi-root { position: fixed; inset: 0; }
      #pixi-root canvas { display: block; width: 100%; height: 100%; }
      .poc-hud { position: fixed; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; pointer-events: none; z-index: 10; }
      .poc-badge, .poc-controls, .poc-report { pointer-events: auto; background: rgb(16 24 38 / 0.88); border: 1.5px solid #8fd3ff; border-radius: 10px; padding: 8px 12px; font-size: 13px; }
      .poc-controls { display: flex; gap: 8px; flex-wrap: wrap; }
      .poc-controls button, .poc-controls a { background: #1e5bb8; color: #fff; border: 0; border-radius: 8px; padding: 7px 12px; font: inherit; font-weight: 700; cursor: pointer; text-decoration: none; }
      .poc-controls button.alt, .poc-controls a.alt { background: #2c384e; }
      .poc-report { position: fixed; left: 10px; bottom: 10px; max-width: min(680px, calc(100vw - 20px)); max-height: 46vh; overflow: auto; white-space: pre-wrap; font-family: ui-monospace, Consolas, monospace; font-size: 12px; z-index: 12; }
      .poc-report[hidden] { display: none; }
    </style>
  </head>
  <body>
    <div id="pixi-root"></div>
    <div class="poc-hud">
      <div class="poc-badge" id="poc-stats">POC PixiJS v8 — chargement…</div>
      <div class="poc-controls">
        <button id="poc-bench" type="button">Banc d'essai (3 tours)</button>
        <button id="poc-bench-fast" class="alt" type="button">Banc rapide (1 tour)</button>
        <button id="poc-copy" class="alt" type="button" hidden>Copier le rapport</button>
        <a class="alt" href="./?lieu=rayon-essai">Version DOM/CSS</a>
      </div>
    </div>
    <pre class="poc-report" id="poc-report" hidden></pre>
    <script type="module" src="/src/pixi/poc.js"></script>
  </body>
</html>
